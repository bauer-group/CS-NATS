# =============================================================================
# Dependabot Configuration
# =============================================================================
# Watches:
#   1. GitHub Actions versions (workflows pinned to @main pull module updates)
#   2. Image references inside docker-compose*.yml files
#   3. Base images in the two src/ Dockerfiles
#   4. Python deps of the nats-init container
#
# Pure digest drift on existing tags is handled by check-base-images.yml
# (daily cron); this surfaces tag bumps and version updates as PRs.
#
# Commit prefixes decide whether a merged update is released:
#   docker, docker-compose -> fix(docker): PATCH release, the images are
#                             rebuilt (base images and the compose files
#                             ship to users)
#   pip (nats-init)        -> fix(deps): PATCH release with rebuilt images.
#                             prefix-development (chore(deps-dev)) applies
#                             only to requirements files whose name contains
#                             "dev"; requirements-test.txt does not, so its
#                             pytest updates release too (redundant, the
#                             runtime image is unchanged - never a missed one)
#   github-actions         -> chore(ci): no release, never auto-merged
# =============================================================================

version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "14:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "github-actions"
      - "dependabot"
    commit-message:
      prefix: "chore(ci)"

  # Docker Compose images
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "14:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "docker"
      - "dependabot"
    commit-message:
      prefix: "fix(docker)"

  # nats server base image (nats:*-alpine in src/nats/Dockerfile)
  - package-ecosystem: "docker"
    directory: "/src/nats"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "14:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "docker"
      - "dependabot"
    commit-message:
      prefix: "fix(docker)"

  # nats-init base images (python:*-alpine + natsio/nats-box in src/nats-init/Dockerfile)
  - package-ecosystem: "docker"
    directory: "/src/nats-init"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "14:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "docker"
      - "dependabot"
    commit-message:
      prefix: "fix(docker)"

  # nats-init Python deps (requirements.txt + requirements-test.txt)
  - package-ecosystem: "pip"
    directory: "/src/nats-init"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "14:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "python"
      - "dependabot"
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps-dev)"
