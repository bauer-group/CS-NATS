name: 🔧 Docker Maintenance

on:
  # No paths filter: every Dependabot PR (docker, pip, docker-compose,
  # github-actions) reaches the module and gets a decision and an annotation
  # instead of silently staying open. It merges only what the required
  # workflow below ran on and passed; GitHub Actions updates and changes
  # under .github/ always stay open for review.
  # docker-compose.*.yml are only validated (docker compose config), never
  # started, by that workflow. Their images are ${VAR:-image}:${VAR:-latest},
  # which Dependabot cannot version, so no such PR arises - pin a compose
  # image to a version only together with a PR test that starts it.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write       # merge
  pull-requests: write  # approve, read the PR
  checks: read          # check runs and suites
  statuses: read        # commit statuses
  actions: write        # dispatch the release; read workflow runs

jobs:
  maintenance:
    name: Auto-merge Dependabot PRs
    uses: bauer-group/automation-templates/.github/workflows/docker-maintenance-dependabot.yml@main
    with:
      merge-method: 'squash'
      auto-approve: true
      # Merge only after this PR CI has passed on the PR head commit - it
      # tests nats-init and builds the images.
      required-workflows: '.github/workflows/docker-release.yml'
      # A merge made with the GITHUB_TOKEN starts no push workflow: dispatch
      # the release on main after a merge and fail this job if it does not
      # succeed (release-wait-minutes, default 60). That run tests and builds
      # the merged commit again, releases exactly that commit (fix(docker) /
      # fix(deps) -> PATCH) and pushes the images only if it released.
      release-workflow: '.github/workflows/docker-release.yml'
    secrets: inherit
