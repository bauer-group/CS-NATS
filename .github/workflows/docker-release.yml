name: 🚀 Release & Docker Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - '.env.example'
  workflow_dispatch:
    inputs:
      force-release:
        description: 'force create release'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  security-events: write
  # Required by docker-build.yml@main: a declared permissions: block sets every
  # unlisted scope to none, and the reusable workflow now needs these three.
  attestations: write   # write the build-provenance attestation
  id-token: write       # OIDC token to sign the attestation (keyless/Sigstore)
  actions: read         # its nested security-analysis job reads run metadata

jobs:
  # ============================================
  # Validation Jobs
  # ============================================

  validate-compose:
    name: 🔍 Validate Docker Compose
    uses: bauer-group/automation-templates/.github/workflows/modules-validate-compose.yml@main
    with:
      compose-files: '["docker-compose.development.yml", "docker-compose.cluster.yml", "docker-compose.coolify.yml"]'
      env-file: '.env.example'
      validate-services: '["nats-1", "nats-2", "nats-3", "nats-init", "nats-exporter"]'

  validate-scripts:
    name: 🔍 Validate Shell Scripts
    uses: bauer-group/automation-templates/.github/workflows/modules-validate-shellscript.yml@main
    with:
      scan-directory: '.'
      severity: 'error'

  test-init:
    name: 🧪 Test nats-init
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install dependencies
        working-directory: src/nats-init
        run: pip install -r requirements-test.txt
      - name: Run unit tests
        working-directory: src/nats-init
        run: pytest

  # ============================================
  # Release Job (push to main or dispatch)
  # ============================================
  # Needs the validation, the nats-init tests and both image builds of this
  # run (the *-validate jobs below run on every event and push nothing): a
  # failed test or build skips the release and every image push. Only a run
  # that created a release publishes - never a PR, a branch dispatch or a
  # run that released nothing.

  release:
    name: 📦 Create Semantic Release
    needs:
      - validate-compose
      - validate-scripts
      - test-init
      - docker-build-nats-validate
      - docker-build-init-validate
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.validate-compose.result == 'success' &&
      needs.validate-scripts.result == 'success' &&
      needs.test-init.result == 'success' &&
      needs.docker-build-nats-validate.result == 'success' &&
      needs.docker-build-init-validate.result == 'success'
    uses: bauer-group/automation-templates/.github/workflows/modules-semantic-release.yml@main
    with:
      target-branch: 'main'
      # Release the commit this run validated and built - the image jobs
      # below build it too. Unpinned, the release would take the tip of
      # main: a push that landed meanwhile would be tagged untested and be
      # missing from the images. Pinned, nothing is released once main has
      # moved on, and the run for the newer main releases both.
      ref: ${{ github.sha }}
      dry-run: false
      force-release: ${{ inputs.force-release || false }}
    secrets: inherit

  # ============================================
  # Docker Build & Push (nats server image)
  # ============================================

  docker-build-nats-release:
    name: 🐳 Build & Push nats
    needs: release
    if: needs.release.outputs.release-created == 'true'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      deploy-environment: 'production'
      publish-to: 'ghcr'
      ghcr-image-name: 'bauer-group/CS-NATS/nats'
      docker-image-name: 'bauergroup/cs-nats'

      release-version: ${{ needs.release.outputs.version }}
      image-tags: 'stable'

      update-dockerfile-version: true
      auto-tags: true
      latest-tag: true

      dockerfile-path: './src/nats/Dockerfile'
      docker-context: './src/nats'
      platforms: 'linux/amd64'

      push: true

      security-scan: false
      security-fail-on: 'CRITICAL'
      generate-sbom: true
      sync-dockerhub-readme: true
    secrets: inherit

  # Every event (PR, push, dispatch): builds the image from this commit
  # without pushing - the PR CI docker-maintenance.yml waits for, and on a
  # push or dispatch a gate of the release.
  docker-build-nats-validate:
    name: 🔨 Validate nats Build
    needs: [validate-compose, validate-scripts, test-init]
    if: |
      needs.validate-compose.result == 'success' &&
      needs.validate-scripts.result == 'success' &&
      needs.test-init.result == 'success'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      publish-to: 'ghcr'
      ghcr-image-name: 'bauer-group/CS-NATS/nats'

      auto-tags: true
      dockerfile-path: './src/nats/Dockerfile'
      docker-context: './src/nats'
      platforms: 'linux/amd64'

      push: false

      security-scan: false
      security-fail-on: 'CRITICAL'
    secrets: inherit

  # ============================================
  # Docker Build & Push (nats-init image)
  # ============================================

  docker-build-init-release:
    name: 🐳 Build & Push nats-init
    needs: release
    if: needs.release.outputs.release-created == 'true'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      deploy-environment: 'production'
      publish-to: 'ghcr'
      ghcr-image-name: 'bauer-group/CS-NATS/nats-init'
      docker-image-name: 'bauergroup/cs-nats-init'

      release-version: ${{ needs.release.outputs.version }}
      image-tags: 'stable'

      update-dockerfile-version: true
      auto-tags: true
      latest-tag: true

      dockerfile-path: './src/nats-init/Dockerfile'
      docker-context: './src/nats-init'
      platforms: 'linux/amd64'

      push: true

      security-scan: false
      security-fail-on: 'CRITICAL'
      generate-sbom: true
      sync-dockerhub-readme: true
    secrets: inherit

  # Every event (PR, push, dispatch): builds the image from this commit
  # without pushing - the PR CI docker-maintenance.yml waits for, and on a
  # push or dispatch a gate of the release.
  docker-build-init-validate:
    name: 🔨 Validate nats-init Build
    needs: [validate-compose, validate-scripts, test-init]
    if: |
      needs.validate-compose.result == 'success' &&
      needs.validate-scripts.result == 'success' &&
      needs.test-init.result == 'success'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      publish-to: 'ghcr'
      ghcr-image-name: 'bauer-group/CS-NATS/nats-init'

      auto-tags: true
      dockerfile-path: './src/nats-init/Dockerfile'
      docker-context: './src/nats-init'
      platforms: 'linux/amd64'

      push: false

      security-scan: false
      security-fail-on: 'CRITICAL'
    secrets: inherit
